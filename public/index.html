<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24/7 Preaching</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 1.5rem 2rem;
      text-align: center;
      background: #1a1a2e;
      border-bottom: 2px solid #16213e;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

    .video-container {
      width: 100%;
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .controls {
      display: flex;
      gap: 1rem;
    }

    button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #c73650;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      color: #aaa;
      font-size: 0.9rem;
      min-height: 1.4em;
    }

    .admin-section {
      width: 100%;
      max-width: 960px;
      padding: 2rem 1rem;
      border-top: 1px solid #222;
    }

    .admin-section h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #aaa;
    }

    .admin-form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .admin-form input {
      min-width: 0;
      flex: 1;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
    }

    #admin-status {
      margin-top: 0.75rem;
      color: #aaa;
      font-size: 0.9rem;
      min-height: 1.4em;
    }
  </style>
</head>
<body>

  <header>
    <h1>24/7 Preaching</h1>
  </header>

  <main>
    <div class="video-container" id="video-container">
      <div id="player"></div>
    </div>

    <div class="controls">
      <button id="next-btn" onclick="nextVideo()" disabled>Next Video</button>
    </div>

    <p id="status" role="status">Loading a video...</p>
  </main>

  <div class="admin-section">
    <h2>Admin: Add a YouTube Channel</h2>
    <div class="admin-form">
      <input type="text" id="channel-id" aria-label="YouTube channel ID" placeholder="YouTube channel ID" />
      <input type="password" id="admin-token" aria-label="Admin token" placeholder="Admin token" />
      <button id="upload-btn" onclick="uploadChannel()">Upload Channel</button>
    </div>
    <p id="admin-status" role="status"></p>
  </div>

  <script>
    const status = document.getElementById('status');
    const nextButton = document.getElementById('next-btn');
    const failedVideos = new Set();
    let player;
    let loading = false;
    let currentVideo;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: { playsinline: 1, origin: window.location.origin },
        events: {
          onReady: () => loadRandomVideo(),
          onStateChange: ({ data }) => {
            if (data === YT.PlayerState.ENDED) loadRandomVideo();
          },
          onAutoplayBlocked: () => {
            status.textContent = 'Press play to start watching.';
          },
          onError: () => {
            if (!currentVideo) return;
            failedVideos.add(currentVideo.videoId);
            if (failedVideos.size >= 10) {
              status.textContent = 'Several videos could not play. Select Next Video to retry.';
              return;
            }
            loadRandomVideo();
          },
        },
      });
    }

    function nextVideo() {
      failedVideos.clear();
      loadRandomVideo();
    }

    async function loadRandomVideo() {
      if (loading) return;
      loading = true;
      nextButton.disabled = true;
      status.textContent = 'Loading a video…';

      const query = new URLSearchParams();
      if (currentVideo) query.set('previous', currentVideo.videoId);
      for (const videoId of failedVideos) query.append('skip', videoId);

      try {
        const response = await fetch('/api/random-video?' + query);
        const data = await response.json();
        if (!response.ok) {
          status.textContent = data.error || 'Failed to load video.';
          return;
        }

        currentVideo = data;
        status.textContent = 'Selected from: ' + data.channel;
        player.loadVideoById(data.videoId);
      } catch {
        status.textContent = 'Error loading video. Select Next Video to retry.';
      } finally {
        loading = false;
        nextButton.disabled = false;
      }
    }

    async function uploadChannel() {
      const input = document.getElementById('channel-id');
      const status = document.getElementById('admin-status');
      const btn = document.getElementById('upload-btn');
      const channelId = input.value.trim();
      const token = document.getElementById('admin-token').value;

      if (!channelId || !token) {
        status.textContent = 'Enter a channel ID and admin token.';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Uploading channel videos... This may take a moment.';

      try {
        const res = await fetch('/api/upload-channel', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify({ channelId }),
        });

        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.error || 'Upload failed.';
        } else {
          status.textContent = data.message;
          input.value = '';
        }
      } catch (e) {
        status.textContent = 'Error uploading channel. Please try again.';
      }

      btn.disabled = false;
    }

  </script>
  <script async src="https://www.youtube.com/iframe_api"
    onerror="document.getElementById('status').textContent = 'Could not load the YouTube player. Refresh to retry.'"></script>

</body>
</html>
