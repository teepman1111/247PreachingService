<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24/7 Preaching</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 1.5rem 2rem;
      text-align: center;
      background: #1a1a2e;
      border-bottom: 2px solid #16213e;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

    .video-container {
      width: 100%;
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .controls {
      display: flex;
      gap: 1rem;
    }

    button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #c73650;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      color: #aaa;
      font-size: 0.9rem;
      min-height: 1.4em;
    }

    .admin-section {
      width: 100%;
      max-width: 960px;
      padding: 2rem 1rem;
      border-top: 1px solid #222;
    }

    .admin-section h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #aaa;
    }

    .admin-form {
      display: flex;
      gap: 0.75rem;
    }

    .admin-form input {
      flex: 1;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
    }

    #admin-status {
      margin-top: 0.75rem;
      color: #aaa;
      font-size: 0.9rem;
      min-height: 1.4em;
    }
  </style>
</head>
<body>

  <header>
    <h1>24/7 Preaching</h1>
  </header>

  <main>
    <div class="video-container" id="video-container">
      <!-- YouTube embed will be injected here -->
    </div>

    <div class="controls">
      <button id="next-btn" onclick="loadRandomVideo()">Next Video</button>
    </div>

    <p id="status">Loading a video...</p>
  </main>

  <div class="admin-section">
    <h2>Admin: Add a YouTube Channel</h2>
    <div class="admin-form">
      <input type="text" id="channel-id" placeholder="YouTube Channel ID" />
      <button id="upload-btn" onclick="uploadChannel()">Upload Channel</button>
    </div>
    <p id="admin-status"></p>
  </div>

  <script>
    async function loadRandomVideo() {
      const status = document.getElementById('status');
      const btn = document.getElementById('next-btn');
      btn.disabled = true;
      status.textContent = 'Loading...';

      try {
        const res = await fetch('/api/random-video');
        if (!res.ok) {
          const err = await res.json();
          status.textContent = err.error || 'Failed to load video.';
          btn.disabled = false;
          return;
        }

        const data = await res.json();
        const container = document.getElementById('video-container');
        container.innerHTML =
          '<iframe src="https://www.youtube.com/embed/' +
          data.videoId +
          '?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
        status.textContent = 'Playing from: ' + data.channel;
      } catch (e) {
        status.textContent = 'Error loading video. Please try again.';
      }

      btn.disabled = false;
    }

    async function uploadChannel() {
      const input = document.getElementById('channel-id');
      const status = document.getElementById('admin-status');
      const btn = document.getElementById('upload-btn');
      const channelId = input.value.trim();

      if (!channelId) {
        status.textContent = 'Please enter a Channel ID.';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Uploading channel videos... This may take a moment.';

      try {
        const res = await fetch('/api/upload-channel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channelId }),
        });

        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.error || 'Upload failed.';
        } else {
          status.textContent = data.message;
          input.value = '';
        }
      } catch (e) {
        status.textContent = 'Error uploading channel. Please try again.';
      }

      btn.disabled = false;
    }

    // Load a random video on page load
    loadRandomVideo();
  </script>

</body>
</html>
