<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24/7 Preaching</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #14181b; color: #f7f5ec; font: 1rem system-ui, sans-serif; }
  main { max-width: 55rem; margin: auto; padding: clamp(1rem, 5vw, 4rem); }
  header { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; }
  h1 { margin: 0 auto 0 0; font-size: 1.4rem; }
  a { color: #b6da9b; }
  form, li { display: flex; align-items: center; flex-wrap: wrap; gap: .75rem; }
  label { width: 100%; }
  input, button { font: inherit; border-radius: .4rem; padding: .7rem; }
  input { min-width: 0; flex: 1; background: #23292c; color: inherit; border: 1px solid #87918a; }
  button { cursor: pointer; background: #b6da9b; color: #14181b; border: 0; }
  button:disabled { opacity: .65; cursor: default; }
  ul { list-style: none; padding: 0; }
  li { justify-content: space-between; padding: .7rem 0; border-bottom: 1px solid #414b46; }
  .screen { aspect-ratio: 16 / 9; background: black; }
  .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
  body.signage { background: black; }
  body.signage main { max-width: none; padding: 0; }
  body.signage .screen { height: 100dvh; }
  #exit-signage { display: none; }
  body.signage #exit-signage {
    display: inline-block;
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 1;
    padding: .65rem .9rem;
    background: #14181b;
    color: #f7f5ec;
    border: 1px solid #87918a;
    border-radius: .4rem;
  }
  #exit-signage:focus-visible { outline: 2px solid #b6da9b; outline-offset: 3px; }
  body.signage #play-status { position: fixed; inset: auto 1rem 1rem; text-align: center; pointer-events: none; }
</style>
<main>
  <header id="navigation">
    <h1>24/7 Preaching</h1>
    <a href="/">Approved videos</a>
    <a href="/watch">Watch</a>
    <a href="/signage">Signage</a>
  </header>
  <section id="admin" hidden>
    <h2>Approved videos</h2>
    <form id="approve">
      <label for="video">YouTube video link or ID</label>
      <input id="video" required maxlength="512" placeholder="https://www.youtube.com/watch?v=…">
      <button>Approve video</button>
    </form>
    <p id="admin-status" role="status"></p>
    <ul id="videos"></ul>
  </section>
  <a id="exit-signage" href="/watch">Exit signage</a>
  <section id="watch" hidden>
    <div class="screen"><div id="player"></div></div>
    <p id="play-status" role="status">Loading the approved loop…</p>
  </section>
</main>
<script>
  const endpoint = '/api/approved-videos';
  const element = id => document.getElementById(id);
  async function readVideos() {
    const response = await fetch(endpoint, { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load the approved videos.');
    return (await response.json()).videoIds;
  }

  async function updateVideo(method, video) {
    const response = await fetch(endpoint, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ video }),
    });
    if (!response.ok) throw new Error((await response.json()).error || 'Could not update the list.');
  }

  async function renderVideos() {
    const ids = await readVideos();
    element('videos').replaceChildren(...ids.map(id => {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = 'https://www.youtube.com/watch?v=' + id;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = id;
      const remove = document.createElement('button');
      remove.textContent = 'Remove';
      remove.setAttribute('aria-label', 'Remove video ' + id);
      remove.onclick = async () => {
        remove.disabled = true;
        try {
          await updateVideo('DELETE', id);
          await renderVideos();
          element('admin-status').textContent = 'Video removed.';
        } catch (error) {
          element('admin-status').textContent = error.message;
          remove.disabled = false;
        }
      };
      item.append(link, remove);
      return item;
    }));
    if (!ids.length) element('admin-status').textContent = 'No approved videos yet.';
  }

  const signage = location.pathname === '/signage';
  if (location.pathname === '/') {
    element('admin').hidden = false;
    const form = element('approve');
    form.onsubmit = async event => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        await updateVideo('POST', element('video').value);
        element('video').value = '';
        await renderVideos();
        element('admin-status').textContent = 'Video approved.';
      } catch (error) {
        element('admin-status').textContent = error.message;
      } finally {
        button.disabled = false;
      }
    };
    renderVideos().catch(error => { element('admin-status').textContent = error.message; });
  } else {
    element('watch').hidden = false;
    if (signage) {
      document.body.classList.add('signage');
      element('navigation').hidden = true;
    }
    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => { element('play-status').textContent = 'Could not load YouTube. Refresh to retry.'; };
    document.head.append(script);
  }

  let player, current, loading = false;
  const failed = new Set();
  const playStatus = element('play-status');

  async function advance() {
    if (loading) return;
    loading = true;
    try {
      const ids = await readVideos();
      const start = ids.indexOf(current) + 1;
      const next = [...ids.slice(start), ...ids.slice(0, start)].find(id => !failed.has(id));
      if (!next) {
        playStatus.textContent = ids.length ? 'Waiting to retry unavailable videos…' : 'No approved videos yet.';
        failed.clear();
        setTimeout(advance, 30000);
        return;
      }
      current = next;
      playStatus.textContent = '';
      player.loadVideoById(next);
    } catch (error) {
      playStatus.textContent = error.message + ' Retrying shortly.';
      setTimeout(advance, 15000);
    } finally {
      loading = false;
    }
  }

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('player', {
      playerVars: { playsinline: 1, origin: location.origin },
      events: {
        onReady: () => { if (signage) player.mute(); advance(); },
        onStateChange: ({ data }) => {
          if (data === YT.PlayerState.PLAYING) {
            failed.clear();
            playStatus.textContent = '';
          }
          if (data === YT.PlayerState.ENDED) advance();
        },
        onAutoplayBlocked: () => { playStatus.textContent = 'Press play to start the loop.'; },
        onError: () => { if (current) failed.add(current); advance(); },
      },
    });
  };
</script>
</html>
